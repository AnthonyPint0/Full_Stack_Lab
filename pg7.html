<!doctype html>
<html>
  <head>
    <title>Arithmetic Calculator</title>

    <style>
      body {
        display: grid;
        place-items: center;
        height: 100vh;
        font-family: Arial;
      }

      .calculator {
        display: grid;
        gap: 15px;
        text-align: center;
      }

      .inputs,
      .buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      input,
      button {
        padding: 10px;
      }

      button {
        background: blue;
        color: white;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="calculator">
      <h2>Arithmetic Calculator</h2>

      <div class="inputs">
        <input type="number" id="n1" placeholder="Number 1" />
        <input type="number" id="n2" placeholder="Number 2" />
      </div>

      <div class="buttons">
        <button id="add">Addition (+)</button>
        <button id="sub">Subtraction (-)</button>
        <button id="mul">Multiplication (*)</button>
        <button id="div">Division (/)</button>
      </div>

      <p id="result">Result:</p>
    </div>

    <script>
      class Calculator {
        constructor() {
          document
            .getElementById("add")
            .addEventListener("click", () => this.add());

          document
            .getElementById("sub")
            .addEventListener("click", () => this.sub());

          document
            .getElementById("mul")
            .addEventListener("click", () => this.mul());

          document
            .getElementById("div")
            .addEventListener("click", () => this.div());
        }

        a = () => Number(document.getElementById("n1").value);
        b = () => Number(document.getElementById("n2").value);

        show = (value) => {
          document.getElementById("result").textContent = "Result: " + value;
        };

        add = () => this.show(this.a() + this.b());

        sub = () => this.show(this.a() - this.b());

        mul = () => this.show(this.a() * this.b());

        div = () => {
          this.show(
            this.b() === 0 ? "Cannot divide by zero" : this.a() / this.b(),
          );
        };
      }

      new Calculator();
    </script>
  </body>
</html>
