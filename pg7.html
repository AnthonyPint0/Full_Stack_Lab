<!doctype html>
<html>
  <head>
    <title>Arithmetic Operations</title>

    <style>
      body {
        display: grid;
        place-items: center;
        height: 100vh;
        font-family: Arial;
      }

      .calculator {
        display: grid;
        gap: 15px;
        text-align: center;
      }

      .inputs,
      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      input,
      button {
        padding: 10px;
      }

      button {
        background: blue;
        color: white;
        border: none;
        cursor: pointer;
      }

      #result {
        font-size: 20px;
      }
    </style>
  </head>

  <body>
    <div class="calculator">
      <h2>Arithmetic Calculator</h2>

      <div class="inputs">
        <input type="number" id="num1" placeholder="Number 1" />
        <input type="number" id="num2" placeholder="Number 2" />
      </div>

      <div class="buttons">
        <button id="add">+</button>
        <button id="sub">-</button>
        <button id="mul">*</button>
        <button id="div">/</button>
      </div>

      <p id="result">Result:</p>
    </div>

    <script>
      class Calculator {
        constructor() {
          this.n1 = () => Number(document.getElementById("num1").value);
          this.n2 = () => Number(document.getElementById("num2").value);

          document
            .getElementById("add")
            .addEventListener("click", () => this.add());

          document
            .getElementById("sub")
            .addEventListener("click", () => this.sub());

          document
            .getElementById("mul")
            .addEventListener("click", () => this.mul());

          document
            .getElementById("div")
            .addEventListener("click", () => this.div());
        }

        display = (value) => {
          document.getElementById("result").innerHTML = "Result: " + value;
        };

        add = () => this.display(this.n1() + this.n2());

        sub = () => this.display(this.n1() - this.n2());

        mul = () => this.display(this.n1() * this.n2());

        div = () => {
          if (this.n2() == 0) this.display("Cannot divide by zero");
          else this.display(this.n1() / this.n2());
        };
      }

      new Calculator();
    </script>
  </body>
</html>
