<!doctype html>
<html>
  <head>
    <title>Arithmetic Calculator</title>

    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .inputs,
      .buttons {
        display: flex;
        gap: 10px;
      }

      input,
      button {
        padding: 10px;
      }

      button {
        background: blue;
        color: white;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Arithmetic Calculator</h2>

      <div class="inputs">
        <input type="number" id="n1" placeholder="Number 1" />
        <input type="number" id="n2" placeholder="Number 2" />
      </div>

      <div class="buttons">
        <button id="add">+</button>
        <button id="sub">-</button>
        <button id="mul">*</button>
        <button id="div">/</button>
      </div>

      <p id="result">Result:</p>
    </div>

    <script>
      const n1 = () => Number(document.getElementById("n1").value);
      const n2 = () => Number(document.getElementById("n2").value);

      const show = (value) => {
        document.getElementById("result").textContent = "Result: " + value;
      };

      document
        .getElementById("add")
        .addEventListener("click", () => show(n1() + n2()));

      document
        .getElementById("sub")
        .addEventListener("click", () => show(n1() - n2()));

      document
        .getElementById("mul")
        .addEventListener("click", () => show(n1() * n2()));

      document.getElementById("div").addEventListener("click", () => {
        show(n2() === 0 ? "Cannot divide by zero" : n1() / n2());
      });
    </script>
  </body>
</html>
