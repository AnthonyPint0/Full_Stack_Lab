<!doctype html>
<html>
  <head>
    <title>Arithmetic Operations</title>

    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: Arial;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .inputs,
      .buttons {
        display: flex;
        gap: 10px;
      }

      input,
      button {
        padding: 10px;
      }

      button {
        background: blue;
        color: white;
        border: none;
        cursor: pointer;
      }

      #result {
        font-size: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Arithmetic Calculator</h2>

      <div class="inputs">
        <input type="number" id="num1" placeholder="Number 1" />
        <input type="number" id="num2" placeholder="Number 2" />
      </div>

      <div class="buttons">
        <button id="add">+</button>
        <button id="sub">-</button>
        <button id="mul">*</button>
        <button id="div">/</button>
      </div>

      <p id="result">Result:</p>
    </div>

    <script>
      let n1 = () => Number(document.getElementById("num1").value);
      let n2 = () => Number(document.getElementById("num2").value);

      let display = (value) => {
        document.getElementById("result").innerHTML = "Result: " + value;
      };

      document
        .getElementById("add")
        .addEventListener("click", () => display(n1() + n2()));

      document
        .getElementById("sub")
        .addEventListener("click", () => display(n1() - n2()));

      document
        .getElementById("mul")
        .addEventListener("click", () => display(n1() * n2()));

      document.getElementById("div").addEventListener("click", () => {
        if (n2() == 0) display("Cannot divide by zero");
        else display(n1() / n2());
      });
    </script>
  </body>
</html>
